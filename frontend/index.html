<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Light/dark browser chrome: dark mark on light tabs, white mark on dark tabs. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-light.svg"
      media="(prefers-color-scheme: light)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-dark.svg"
      media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus AI</title>

    <meta name="title" content="Nexus AI" />
    <meta name="description" content="Nexus AI" />

    <!-- Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nexus AI" />
    <meta property="og:description" content="Nexus AI" />
    <meta property="og:image" content="/promo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Nexus AI" />
    <meta property="twitter:description" content="Nexus AI" />
    <meta property="twitter:image" content="/promo.png" />

    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div id="root" class="h-screen"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
