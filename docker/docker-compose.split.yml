# Split deployment: frontend (nginx + built SPA) and backend (server + collector)
# run as two separate containers built from the same ./docker/Dockerfile.
#
#   docker compose -f docker-compose.split.yml up -d --build
#
# The UI is served on http://localhost:3000 and proxies /api to the backend.
# For the single-container setup use docker-compose.yml instead.
name: nexusai-split

volumes:
  # Declared so STORAGE_LOCATION can name a docker-managed volume rather than a host
  # directory. Compose reads a value that looks like a path as a bind mount and anything
  # else as a reference to a volume declared here, so one variable covers both.
  nexusai-storage:
  # See docker-compose.yml: the models the nexusai-models job fetches.
  nexusai-models:
  prometheus-data:
  grafana-data:

networks:
  nexusai:
    driver: bridge

services:
  # See docker-compose.yml for why these models are not in the image.
  nexusai-models:
    image: curlimages/curl:latest
    container_name: nexusai-models
    user: "0:0"
    entrypoint: ["sh", "/prefetch-models.sh", "/models"]
    environment:
      NEXUSAI_OFFLINE: ${NEXUSAI_OFFLINE:-0}
    volumes:
      - "${NEXUSAI_MODELS_DIR:-nexusai-models}:/models"
      - "./prefetch-models.sh:/prefetch-models.sh:ro"
    networks:
      - nexusai
    restart: "no"

  # Named `nexusai` rather than `backend` so that it matches the service name in
  # docker-compose.yml. The optional overlays - llamacpp, sdcpp, speech -
  # fill in provider defaults by patching that name, and a compose overlay cannot
  # name a service its base file does not have. The container is still
  # nexusai-backend, and `-f docker-compose.split.yml up -d nexusai` is how you
  # address it on its own.
  nexusai:
    container_name: nexusai-backend
    # See the note in docker-compose.yml: an explicit image name is what lets a
    # prebuilt image be used in place of a local build.
    image: ${NEXUSAI_IMAGE:-nexusai-split-nexusai}
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: backend-production
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    cap_add:
      - SYS_ADMIN
    volumes:
      - "./.env:/app/server/.env"
      # Where all persistent state lives - the SQLite database, embedded documents and the
      # vector cache. Either a docker volume name (see the volumes: block below) or a host
      # directory. Deliberately has no default: state kept inside this repository would be
      # destroyed by a `git clean -xfd` on the deploy checkout.
      - "${STORAGE_LOCATION:?set STORAGE_LOCATION in docker/.env - a docker volume name, or a host directory outside this repo. See docker/.env.example}:/app/server/storage"
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
      - "${NEXUSAI_MODELS_DIR:-nexusai-models}:/app/prebuilt-models:ro"
    depends_on:
      nexusai-models:
        condition: service_completed_successfully
    user: "${UID:-1000}:${GID:-1000}"
    # Only needed if you want to hit the API directly - the frontend container
    # reaches the backend over the compose network, not through this port.
    ports:
      - "${BACKEND_PUBLISH_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      # Keep unattended agent skills enabled by default, with a deployment-level
      # override available through docker/.env.
      AGENT_AUTO_APPROVED_SKILLS: "${AGENT_AUTO_APPROVED_SKILLS:-<all>}"
      # Where the backend reaches Grafana to serve it under /grafana, which nginx
      # passes through. See docker-compose.yml.
      GRAFANA_INTERNAL_URL: "${GRAFANA_INTERNAL_URL-http://grafana:3000}"
      # Only used when the proxy is off and GRAFANA_PUBLIC_URL is unset.
      GRAFANA_PUBLISH_PORT: "${GRAFANA_PUBLISH_PORT:-3300}"
    networks:
      - nexusai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    container_name: nexusai-frontend
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: frontend-nginx
      args:
        # "/api" = same origin as the page, proxied to the backend by nginx.
        # Only change this if the browser must call the backend on another origin.
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    environment:
      BACKEND_HOST: nexusai
      BACKEND_PORT: 3001
    ports:
      - "${FRONTEND_PUBLISH_PORT:-3000}:80"
    depends_on:
      - nexusai
    networks:
      - nexusai
    restart: unless-stopped

  # --- Monitoring stack (Prometheus + cAdvisor + node-exporter + Grafana) ---
  # Grafana dashboards live at http://localhost:${GRAFANA_PUBLISH_PORT:-3300}
  # Default login is admin/admin unless GRAFANA_ADMIN_USER/PASSWORD are set in docker/.env.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: nexusai-cadvisor
    # See docker-compose.yml: only what the dashboard reads, at the scrape interval.
    command:
      - -housekeeping_interval=15s
      - -docker_only=true
      - -store_container_labels=false
      - -disable_metrics=advtcp,app,cpuLoad,cpu_topology,cpuset,hugetlb,memory_numa,percpu,pressure,process,referenced_memory,resctrl,sched,tcp,udp
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - nexusai
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: nexusai-node-exporter
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro"
    networks:
      - nexusai
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: nexusai-prometheus
    volumes:
      - "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "prometheus-data:/prometheus"
    ports:
      - "${PROMETHEUS_PUBLISH_PORT:-9090}:9090"
    depends_on:
      - cadvisor
      - node-exporter
    networks:
      - nexusai
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: nexusai-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      # See docker-compose.yml for why each of these is set.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LIVE_MAX_CONNECTIONS: "0"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro"
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PUBLISH_PORT:-3300}:3000"
    depends_on:
      - prometheus
    networks:
      - nexusai
    restart: unless-stopped
