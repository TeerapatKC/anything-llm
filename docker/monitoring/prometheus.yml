global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # docker-compose.gpu-monitoring.yml. Down, not an error, on a stack started
  # without that overlay - the dashboard's status row says which.
  - job_name: "nvidia-gpu"
    static_configs:
      - targets: ["gpu-exporter:9835"]

  - job_name: "nexusai"
    metrics_path: /metrics
    static_configs:
      - targets: ["nexusai:3001"]
