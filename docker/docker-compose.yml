name: nexusai

volumes:
  # Declared so STORAGE_LOCATION can name a docker-managed volume rather than a host
  # directory. Compose reads a value that looks like a path as a bind mount and anything
  # else as a reference to a volume declared here, so one variable covers both.
  nexusai-storage:
  # The embedder, reranker, transcription model and OCR data the nexusai-models job
  # fetches. Unused when NEXUSAI_MODELS_DIR points the mounts at a directory of your
  # own - which is how an air-gapped install runs, off the bundle's models/nexusai.
  nexusai-models:
  prometheus-data:
  grafana-data:

networks:
  nexusai:
    driver: bridge

services:
  # A one-shot downloader rather than a step in the app image: about 2GB of models
  # that never change with the code, and were carried to the customer again with
  # every update while they were baked in. A pre-seeded directory makes this a
  # quick check that exits successfully without opening a connection.
  nexusai-models:
    image: curlimages/curl:latest
    container_name: nexusai-models
    # The named volume is created root-owned, and the curl image's own user
    # cannot write to it.
    user: "0:0"
    entrypoint: ["sh", "/prefetch-models.sh", "/models"]
    environment:
      NEXUSAI_OFFLINE: ${NEXUSAI_OFFLINE:-0}
    volumes:
      - "${NEXUSAI_MODELS_DIR:-nexusai-models}:/models"
      - "./prefetch-models.sh:/prefetch-models.sh:ro"
    networks:
      - nexusai
    restart: "no"

  nexusai:
    container_name: nexusai
    # Naming the image explicitly is what lets a prebuilt one be used instead of
    # a local build: with both `image` and `build` set, compose builds only when
    # the image is absent. Load a tarball from docker/build-arm64.sh, point
    # NEXUSAI_IMAGE at its tag, and `up` runs it as-is. The default is the name
    # compose would have generated anyway, so nothing changes without it.
    image: ${NEXUSAI_IMAGE:-nexusai-nexusai}
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    cap_add:
      - SYS_ADMIN
    volumes:
      - "./.env:/app/server/.env"
      # Where all persistent state lives - the SQLite database, embedded documents and the
      # vector cache. Either a docker volume name (see the volumes: block below) or a host
      # directory. Deliberately has no default: state kept inside this repository would be
      # destroyed by a `git clean -xfd` on the deploy checkout.
      - "${STORAGE_LOCATION:?set STORAGE_LOCATION in docker/.env - a docker volume name, or a host directory outside this repo. See docker/.env.example}:/app/server/storage"
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
      # Read-only: the entrypoint copies what the app writes to into the storage
      # volume, and Whisper is only ever read.
      - "${NEXUSAI_MODELS_DIR:-nexusai-models}:/app/prebuilt-models:ro"
    depends_on:
      nexusai-models:
        condition: service_completed_successfully
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # This deployment is intended to run unattended. Keep this overrideable from
      # docker/.env, while allowing all agent skills by default as requested.
      AGENT_AUTO_APPROVED_SKILLS: "${AGENT_AUTO_APPROVED_SKILLS:-<all>}"
      # Where the app reaches Grafana to show it under its own /grafana route, so a
      # browser never needs Grafana's port. Set GRAFANA_PUBLIC_URL to have browsers
      # load Grafana directly instead, or GRAFANA_INTERNAL_URL='' to turn this off.
      GRAFANA_INTERNAL_URL: "${GRAFANA_INTERNAL_URL-http://grafana:3000}"
      # Only used when the proxy is off and GRAFANA_PUBLIC_URL is unset.
      GRAFANA_PUBLISH_PORT: "${GRAFANA_PUBLISH_PORT:-3300}"
    networks:
      - nexusai
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Monitoring stack (Prometheus + cAdvisor + node-exporter + Grafana) ---
  # Grafana dashboards live at http://localhost:${GRAFANA_PUBLISH_PORT:-3300}
  # Default login is admin/admin unless GRAFANA_ADMIN_USER/PASSWORD are set in docker/.env.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: nexusai-cadvisor
    # By default cAdvisor re-reads every cgroup on the host once a second and
    # exports per-CPU, process and socket detail - on a DGX that held a full core
    # (~110% CPU) to feed a Prometheus that only scrapes every 15s. The dashboard
    # (monitoring/grafana/dashboards/docker-overview.json) reads cpu, memory,
    # network and disk I/O for the app's containers, by name, and nothing else, so
    # that is all that is collected, at the scrape interval.
    command:
      - -housekeeping_interval=15s
      - -docker_only=true
      - -store_container_labels=false
      - -disable_metrics=advtcp,app,cpuLoad,cpu_topology,cpuset,hugetlb,memory_numa,percpu,pressure,process,referenced_memory,resctrl,sched,tcp,udp
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - nexusai
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: nexusai-node-exporter
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro"
    networks:
      - nexusai
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: nexusai-prometheus
    volumes:
      - "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "prometheus-data:/prometheus"
    ports:
      - "${PROMETHEUS_PUBLISH_PORT:-9090}:9090"
    depends_on:
      - cadvisor
      - node-exporter
    networks:
      - nexusai
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: nexusai-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      # Served from /grafana, because that is where the app proxies it
      # (server/utils/grafanaProxy.js).
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Grafana Live pushes over a websocket the proxy does not carry; dashboards
      # refresh by polling instead.
      GF_LIVE_MAX_CONNECTIONS: "0"
      # Nothing to phone home to on an air-gapped host.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro"
    ports:
      # Loopback only. Users see Grafana through the app's /grafana route, so no
      # other machine needs this port - it stays for an operator's SSH tunnel.
      # GRAFANA_BIND_ADDRESS=0.0.0.0 publishes it to the network again.
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PUBLISH_PORT:-3300}:3000"
    depends_on:
      - prometheus
    networks:
      - nexusai
    restart: unless-stopped
