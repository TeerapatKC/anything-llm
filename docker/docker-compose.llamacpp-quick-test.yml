# Small, real GGUF models for checking the live model picker and chat flow.
# Layer this last, after docker-compose.llamacpp-models.yml. It overrides the
# remote LLM URL and LLAMACPP_MODELS='' from docker/.env only for this run.
# Starting the overlay does not edit docker/.env or downloaded large-model files.
# Saving from the Settings page can persist the test values to docker/.env.
services:
  nexusai:
    environment:
      GENERIC_OPEN_AI_BASE_PATH: http://llamacpp:8080/v1
      GENERIC_OPEN_AI_MODEL_PREF: qwen2.5-0.5b
      GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT: "2048"
      GENERIC_OPEN_AI_MAX_TOKENS: "256"
      GENERIC_OPEN_AI_ALLOWED_MODELS: ""

  llamacpp-models:
    environment:
      LLAMACPP_MODELS: qwen2.5-0.5b,smollm2-360m,gemma3-270m
      LLAMACPP_CTX: "2048"

  llamacpp:
    environment:
      LLAMA_ARG_CTX_SIZE: "2048"
